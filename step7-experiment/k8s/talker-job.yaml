apiVersion: batch/v1
kind: Job
metadata:
  name: talker-run
  namespace: tsn-experiment
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: talker
    spec:
      # control-plane 노드에 배치 (논문: 다른 호스트에 talker/listener 배치)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      restartPolicy: Never
      containers:
        - name: talker
          image: tsn-talker:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--target=$(LISTENER_IP)"
            - "--port=5000"
            - "--interval=1"
            - "--count=10000"
            - "--size=128"
            - "--log=/data/talker-log.csv"
          env:
            - name: LISTENER_IP
              value: "listener-svc.tsn-experiment.svc.cluster.local"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_NICE"]
      volumes:
        - name: data
          emptyDir: {}

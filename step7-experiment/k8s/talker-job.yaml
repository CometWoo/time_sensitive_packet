# talker-job.yaml — TS 패킷 송신기 Job (Host-s = control-plane/sender 노드)  ★ 템플릿
#
# __PLACEHOLDER__ 는 deploy-experiment.sh run 이 sed 로 치환한 뒤 적용한다. 손으로 적용하려면
# 값을 채우거나 env 항목을 지우면 된다 (command 의 ${VAR:-default} 가 기본값을 쓴다).
#
# 배치: control-plane 노드 = sender. 이 노드의 물리 NIC egress 에 qdisc 와 ts_classifier 가 있다.
# 목적지: Pod IP 를 직접 넘긴다. talker.py 는 어차피 시작 시 한 번만 해석하지만(ADR-0008),
#   Pod IP 를 쓰면 CoreDNS 가 실험 경로에서 완전히 빠진다.
# --so-priority 6: 문서용으로 유지한다. Pod 안에서 설정한 skb->priority 는 veth 를 건너는 순간
#   ____dev_forward_skb() 가 0 으로 지우므로(include/linux/netdevice.h) 호스트 qdisc 에는
#   전달되지 않는다. 호스트 qdisc 가 보는 priority 는 오직 ts_classifier 가 NIC egress 에서
#   설정한 값이다. SO_PRIORITY <= 6 은 CAP_NET_ADMIN 없이 설정 가능하다 (net/core/sock.c).
# QoS: requests == limits == 1 CPU (Guaranteed). talker 는 매 1 ms 주기의 마지막 ~200 us 를
#   busy-wait 하므로 500m 같은 CFS 쿼터는 수십 ms 의 throttling 정지를 만들어 "jitter" 로
#   기록된다. 한 코어를 온전히 준다.
# 권한: 없음 (capabilities drop ALL). --realtime(SCHED_FIFO) 을 쓰려면 SYS_NICE 를 추가해야 한다.
# 실패 처리: backoffLimit 0 — 재시도하면 seq 0 부터 다시 보내 listener CSV 에 두 번 섞인다.
#   activeDeadlineSeconds(__TALKER_DEADLINE_S__) 는 송신 시간(TS_COUNT*TS_INTERVAL_MS) + 120 s.
#   실패한 run 은 CSV 를 남기지 않는다. ttlSecondsAfterFinished 는 스크립트가 로그를 수집한 뒤의 보험.
# 로그 수집: Job Pod 는 Completed 가 되면 kubectl cp 가 안 되므로 드리프트 로그를 stdout 에
#   같이 찍고 스크립트가 `kubectl logs` 에서 잘라낸다 (### TALKER_LOG_BEGIN/END).
# CPU 요청(__TALKER_CPU_REQUEST__, 기본 1): 2 vCPU control-plane 에서 apiserver/etcd/cilium 요청과 합쳐
#   allocatable 을 넘으면 Pending 이 된다 → experiment.env TALKER_CPU_REQUEST=500m (Guaranteed 는 유지되나
#   CFS 쿼터 throttling 이 jitter 에 섞일 수 있음 — meta.json 에 기록된다).
apiVersion: batch/v1
kind: Job
metadata:
  name: talker-run
  labels:
    app: talker
spec:
  backoffLimit: 0
  activeDeadlineSeconds: __TALKER_DEADLINE_S__
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: talker
    spec:
      restartPolicy: Never
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: talker
          image: __IMAGE_PY__
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 /app/talker.py \
                --target "${TS_TARGET:?TS_TARGET (listener Pod IP) is required}" \
                --port "${TS_PORT:-6000}" --interval "${TS_INTERVAL_MS:-1}" \
                --count "${TS_COUNT:-10000}" --size "${TS_SIZE:-128}" \
                --so-priority "${TS_SO_PRIORITY:-6}" --cpu "${TALKER_CPU:--1}" \
                --quiet --log /tmp/talker_drift.csv
              rc=$?
              echo "### TALKER_LOG_BEGIN"
              cat /tmp/talker_drift.csv 2>/dev/null
              echo "### TALKER_LOG_END"
              exit $rc
          env:
            - name: TS_TARGET
              value: "__TS_TARGET__"
            - name: TS_PORT
              value: "__TS_PORT__"
            - name: TS_INTERVAL_MS
              value: "__TS_INTERVAL_MS__"
            - name: TS_COUNT
              value: "__TS_COUNT__"
            - name: TS_SIZE
              value: "__TS_SIZE__"
            - name: TS_SO_PRIORITY
              value: "6"
            - name: TALKER_CPU
              value: "__TALKER_CPU__"
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: "__TALKER_CPU_REQUEST__"
              memory: "128Mi"
            limits:
              cpu: "__TALKER_CPU_REQUEST__"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: talker-script

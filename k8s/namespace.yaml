# namespace.yaml — 실험 전용 네임스페이스. cleanup 은 이 네임스페이스를 통째로 지운다.
#
# __NAMESPACE__ 는 scripts/experiment.sh deploy-k8s 가 experiment.env 의 NAMESPACE 로 치환한다
# (기본 tsn-experiment). 다른 매니페스트와 kustomization.yaml 은 namespace 를 적지 않는다 —
# 배치는 'kubectl -n $NAMESPACE apply' 가 정하므로 NAMESPACE 를 바꾸면 전부 따라온다.
# 이 파일은 kustomization.yaml 의 resources 에 포함되지 않는다 (플레이스홀더 때문).
apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
  labels:
    purpose: tsn-reproduction

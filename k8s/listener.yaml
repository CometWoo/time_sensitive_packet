# listener.yaml — TS 패킷 수신/측정기 (Host-r = worker 노드)
#
# 배치: control-plane 이 아닌 노드 (nodeAffinity). talker 는 control-plane(sender) 노드에 뜨므로
#       두 Pod 사이의 경로가 sender NIC(egress qdisc + ts_classifier) → 네트워크 → receiver 가 된다.
# 이름 해석: headless Service(listener-svc)는 사람이 쓰기 위한 것. scripts/experiment.sh 는
#       Pod IP 를 직접 talker 에 넘긴다 (u32 필터도 이 IP 로 HTB class 를 고른다).
# 수집: listener.py 는 마지막 패킷 뒤 --timeout 초가 지나면 CSV 를 쓰고 종료한다. 컨테이너가
#       종료되면 kubectl cp 가 불가능하므로 `sleep infinity` 로 컨테이너를 살려 둔다. 실행마다
#       scripts/experiment.sh 가 Pod 를 지워 새 listener(빈 /data)로 시작한다.
# 준비 상태: --ready-file 은 bind 완료 후 생기므로 readinessProbe 가 그 파일을 보면
#       "Ready = 소켓이 열려 있음" 이 된다 (kubectl wait --for=condition=ready 의 근거).
# QoS: requests == limits → Guaranteed. 500m 같은 CFS 쿼터는 1 ms 주기 수신 루프를 수십 ms 씩
#       멈추게 할 수 있어(throttling) 측정에 섞이므로 쓰지 않는다.
# 권한: 필요 없음. IP_RECVTOS/SO_RCVBUF 는 무권한, CPU affinity 는 자기 프로세스에 대해 무권한.
# env: TS_PORT/TS_INTERVAL_MS/LISTENER_CPU 는 deploy-k8s 가 experiment.env 값으로 `kubectl set env` 한다.
apiVersion: v1
kind: Service
metadata:
  name: listener-svc
spec:
  clusterIP: None
  selector:
    app: listener
  ports:
    - name: ts-udp
      protocol: UDP
      port: 6000
      targetPort: 6000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listener
spec:
  replicas: 1
  strategy:
    type: Recreate          # 두 listener 가 동시에 있으면 Pod IP/필터가 어긋난다 → 항상 하나만
  selector:
    matchLabels:
      app: listener
  template:
    metadata:
      labels:
        app: listener
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: listener
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 /app/listener.py \
                --port "${TS_PORT:-6000}" --interval "${TS_INTERVAL_MS:-1}" \
                --timeout 8 --record-tos --cpu "${LISTENER_CPU:--1}" \
                --ready-file /data/listener.ready --output /data/results.csv
              echo "listener exited rc=$? -- container kept alive for kubectl cp"
              exec sleep infinity
          env:
            - name: TS_PORT
              value: "6000"
            - name: TS_INTERVAL_MS
              value: "1"
            - name: LISTENER_CPU
              value: "-1"
          ports:
            - name: ts-udp
              containerPort: 6000
              protocol: UDP
          readinessProbe:
            exec:
              command: ["cat", "/data/listener.ready"]
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 30
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: listener-script
        - name: data
          emptyDir: {}

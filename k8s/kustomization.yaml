# kustomization.yaml — 실험 기본 리소스 (scripts/experiment.sh deploy-k8s 가 적용)
#
# ConfigMap 은 저장소의 .py 파일에서 생성한다 (단일 소스 — YAML 안에 스크립트 사본을 두지 않는다).
# 파일이 kustomization 디렉터리 밖(../workload)에 있으므로 kustomize 의 load
# restrictor 를 풀어야 한다:
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s | kubectl apply -f -
#
# (`kubectl apply -k` 는 이 플래그를 받지 않는다.) disableNameSuffixHash 로 이름을 고정해
# Deployment/Job 이 항상 같은 ConfigMap 이름을 참조한다 — 내용이 바뀌면 deploy-k8s 가
# listener/udp-sink 를 rollout restart 한다.
#
# 실행마다 값이 바뀌는 리소스(talker-job.yaml, be-flood-job.yaml, stress-daemonset.yaml)와
# namespace.yaml(이름 = experiment.env 의 NAMESPACE)은 여기 포함하지 않는다:
# scripts/experiment.sh 가 __PLACEHOLDER__ 를 치환해 따로 적용한다.
#
# namespace 필드를 두지 않는다: 매니페스트도 namespace 를 적지 않고 'kubectl -n $NAMESPACE apply -f -'
# 가 배치를 정한다. (여기에 고정하면 NAMESPACE 설정이 거짓말이 된다 — kubectl 이 "namespace 불일치" 로 거부.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - listener.yaml
  - udp-sink.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    purpose: tsn-reproduction

configMapGenerator:
  - name: talker-script
    files:
      - talker.py=../workload/talker.py
  - name: listener-script
    files:
      - listener.py=../workload/listener.py
  - name: be-flood-script
    files:
      - be_flood.py=../workload/be_flood.py
  - name: udp-sink-script
    files:
      - udp_sink.py=../workload/udp_sink.py

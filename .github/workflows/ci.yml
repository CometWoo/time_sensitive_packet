name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (shellcheck / ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          git ls-files '*.sh' | xargs shellcheck -S warning -x
      - name: ruff
        run: |
          python -m pip install -q ruff
          ruff check .

  bpf:
    name: eBPF build + BPF_PROG_TEST_RUN + tcx chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm make gcc pkg-config libbpf-dev linux-libc-dev python3-pytest iproute2
          bash scripts/ci/install-bpftool.sh
          uname -r; clang --version | head -1; pkg-config --modversion libbpf
      - name: build
        run: |
          make -C bpf
          make -C bpf tools
          make -C bpf verify
      - name: unit tests (bpftool prog run)
        run: sudo -E env "PATH=$PATH" make -C bpf test
      - name: tcx chain integration test (kernel >= 6.6)
        run: sudo -E env "PATH=$PATH" make -C bpf test-tcx
      - uses: actions/upload-artifact@v4
        with:
          name: bpf-objects
          path: |
            bpf/build/*.bpf.o
            bpf/build/tcx_attach

  analysis:
    name: analysis tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -q -e "./analysis[dev]"
      - name: pytest
        run: cd analysis && python -m pytest -q
